<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>省份 · 全国乡村片区化数据库</title>
<meta name="description" content="31 个省级单位的片区数量、主统计与待核占比，点击进入该省片区清单。">
<link rel="canonical" href="https://ruraldevelopment.jinhuazhang.top/provinces.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="全国乡村片区化数据库">
<meta property="og:title" content="省份 · 全国乡村片区化数据库">
<meta property="og:description" content="31 个大陆省级单位的片区建档情况与待核占比。">
<meta property="og:url" content="https://ruraldevelopment.jinhuazhang.top/provinces.html">
<meta property="og:image" content="https://ruraldevelopment.jinhuazhang.top/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="index.html"><div class="mark">片</div><b>全国乡村片区化数据库</b></a>
    <nav class="main">
      <a href="index.html">概览</a><a href="map.html">地图</a><a href="provinces.html">省份</a>
      <a href="explore.html">检索</a><a href="method.html">方法与质量</a><a href="about.html">关于</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="filterbar" style="margin-top:22px">
    <input type="search" id="kw" placeholder="省份名称">
    <label style="font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="only"> 仅看有数据
    </label>
    <span style="margin-left:auto;font-size:12px;color:var(--ink-3)" id="cnt">—</span>
  </div>
  <div class="provgrid" id="grid"></div>
</div>

<footer>
  <div class="wrap">
    <div class="cols">
      <div><h4>全国乡村片区化数据库</h4>
        <p>记录中国大陆 31 个省级单位、县/区以下、以片区为单元推进乡村振兴的实践。</p></div>
      <div><h4>数据</h4><ul><li><a href="about.html">下载 CSV / GeoJSON</a></li><li><a href="method.html">口径与方法</a></li></ul></div>
      <div><h4>引用</h4><ul><li>数据快照 <span id="f-snapshot">—</span></li><li><a href="about.html#cite">引用格式</a></li></ul></div>
    </div>
    <div class="copy"><span>© 2026 · 学术用途</span><span>ruraldevelopment.jinhuazhang.top</span></div>
  </div>
</footer>

<script src="assets/data/summary.js"></script>
<script src="assets/app.js"></script>
<script>
(function(){
  var RD = window.RD || {}, kit = window.RDKit, fmt = kit.fmt;
  document.getElementById("f-snapshot").textContent = RD.snapshot || "—";
  var grid = document.getElementById("grid");
  var kw = document.getElementById("kw"), only = document.getElementById("only");

  function render(){
    var q = kw.value.trim();
    var list = (RD.provinces || []).filter(function(p){
      if (q && p.name.indexOf(q) < 0) return false;
      if (only.checked && !p.areas) return false;
      return true;
    });
    document.getElementById("cnt").textContent = list.length + " 个省级单位";
    grid.innerHTML = list.map(function(p){
      return '<div class="provcard" data-code="' + p.code + '">' +
        '<div class="n">' + p.name + "</div>" +
        '<div class="a">' + fmt(p.areas) + "</div>" +
        '<div class="m">主统计 ' + fmt(p.main) + " · 待核 " + fmt(p.pending) +
        "（" + (p.areas ? p.pending_share : 0) + "%）</div>" +
        '<div class="p"><i style="width:' + (p.areas ? p.pending_share : 0) + '%"></i></div>' +
      "</div>";
    }).join("");
    Array.prototype.forEach.call(grid.querySelectorAll(".provcard"), function(c){
      c.onclick = function(){ location.href = "explore.html?prov=" + c.getAttribute("data-code"); };
    });
  }
  kw.addEventListener("input", render);
  only.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
