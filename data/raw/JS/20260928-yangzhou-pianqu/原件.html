<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于网站停止更新的公告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", SimSun, "宋体", sans-serif;
        }
        body {
            background-color: #f8f8f8;
            color: #333;
            padding: 60px 20px;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: #fff;
            border: 2px solid #c00;
            padding: 50px 60px;
            border-radius: 4px;
        }
        h1 {
            text-align: center;
            color: #c00;
            font-size: 28px;
            margin-bottom: 40px;
            font-weight: bold;
        }
        .content {
            font-size: 18px;
            line-height: 2.2;
            text-indent: 2em;
            margin-bottom: 40px;
        }
        .tip {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-top: 30px;
        }
        .count {
            color: #c00;
            font-weight: bold;
        }
        .link-box {
            text-align: center;
            margin-top: 20px;
        }
        a {
            color: #c00;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- 5秒自动跳转 -->
    <meta http-equiv="refresh" content="5;url=https://www.jsxc.gov.cn/">
</head>
<body>
    <div class="container">
        <h1>关于网站停止更新的公告</h1>
        <div class="content">
            根据统一要求，江苏文明网相关内容已迁移至江苏宣传网（https://www.jsxc.gov.cn/），江苏文明网即日起停止更新，并于2026年6月30日关停。特此公告。
        </div>
        <div class="tip">
            页面将在 <span class="count" id="timer">5</span> 秒后自动跳转至江苏宣传网
        </div>
        <div class="link-box">
            若未自动跳转，请<a href="https://www.jsxc.gov.cn/">点击此处前往</a>
        </div>
    </div>

    <script>
        // 倒计时数字动态递减
        let time = 5;
        const timerDom = document.getElementById('timer');
        setInterval(() => {
            time--;
            timerDom.innerText = time;
            if (time <= 0) clearInterval();
        }, 1000);
    </script>
</body>
</html>
